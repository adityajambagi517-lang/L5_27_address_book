name: Static Code Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis tools
        run: python -m pip install --upgrade pylint bandit flake8
      - name: Run Bandit
        continue-on-error: true
        run: bandit -r address_book.py -f txt -o bandit_report.txt
      - name: Run PyLint
        continue-on-error: true
        run: pylint address_book.py > pylint_report.txt
      - name: Run Flake8
        continue-on-error: true
        run: flake8 address_book.py --format=default > flake8_report.txt
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            pylint_report.txt
            bandit_report.txt
            flake8_report.txt
          if-no-files-found: warn
